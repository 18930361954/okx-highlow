strategy:
  # 顶层 = 兜底默认。每个账户会在 accounts[].strategy 里覆盖 signal_bar 和三币 tp/sl/float。
  # 顶层不再挂 pair_overrides,避免污染每账户配置(以前的"3 币安全档"已迁移到每账户)。
  pairs: [BTC-USDT-SWAP, ETH-USDT-SWAP, SOL-USDT-SWAP]
  position_pct: 0.10                  # 每笔仓位 10% 保证金,3 币满仓时占 30% 保证金
  leverage: 100                       # 默认 100x;SOL 由 pair_overrides 覆盖到 50x (实盘 API 上限)
  float_pct: 0.0015                   # 兜底,每账户会覆盖
  tp_pct: 0.012
  sl_pct: 0.005
  trend_filter: true
  max_consecutive_losses: 3
  cooldown_hours: 24
  fixed_mode_threshold: 800000
  fixed_mode_margin: 1000
  signal_time_utc: "00:00"
  # 多币下单之间的间隔(秒)。防 OKX algo 单并发限流导致 51149 下单超时。
  place_gap_sec: 1.0

  # 持仓超时强平: 持有超过 max_hold_bars × 信号桶时长 → 市价平仓 (exit_reason=TIME)。
  # 0 = 关闭。pair_overrides 可单独覆盖。
  # 为什么需要: 回测在信号桶末按收盘价强平(EOB), 实盘 daily_cancel 只撤未成交挂单、
  # 已成交持仓一直持到 TP/SL。单边行情下逆势单因此从"桶末小亏"变成"打满 SL" ——
  # 2026-08-19 起 ETH +34% 那波, BTC 1D 空单实际持仓 47h、SOL 6H 空单 17h。
  # 定档依据(2026-08-22 回测, scripts/trade_ledger.py, 9 腿合计 R 倍数):
  #   不设 +973R / MDD 10.59, 0.5 桶 +1059R / MDD 9.94, 1 桶 +1029R, 2 桶 +997R
  #   越紧越好一路单调到 0.25 桶(+1091R), 无内部峰 → 结构性修复而非曲线拟合;
  #   分 5 个半年期 4 胜 1 平无恶化; 8/17 单边窗口 -5.53R → +0.88R。
  #   取 0.5 而非 0.25: 后者总 R 更高但离场过频, 实盘滑点敏感度未单独验证。
  # 换算: 6H 腿=3h, 4H 腿=2h, 12H 腿=6h, 1D 腿=12h。
  max_hold_bars: 0.5

  # 单笔张数封顶(与回测口径一致)
  # BTC 1000 张 × 0.01 = 10 BTC/笔;ETH 5000 张 × 0.1 = 500 ETH/笔;SOL 5000 张 × 1 = 5000 SOL/笔
  # 每账户 pair_overrides 可加 max_contracts 单独覆盖
  max_contracts:
    BTC-USDT-SWAP: 1000
    ETH-USDT-SWAP: 5000
    SOL-USDT-SWAP: 5000

system:
  log_level: INFO
  log_keep_days: 14
  db_path: data/trades.db
  daily_report_time_utc: "23:55"

  # P3优化: Webhook 通知配置 (可选)
  # 支持的渠道: dingtalk / feishu / slack / wecom / generic
  # 留空则不发送通知
  webhook:
    enabled: false                    # 是否启用 Webhook 通知
    url: ""                           # Webhook 地址 (钉钉/飞书/Slack/企业微信的 Webhook URL)
    channel: "dingtalk"               # 通知渠道类型
    timeout: 5                        # 请求超时时间（秒）
    alert_threshold:                  # 告警阈值配置
      balance_drift: 10.0             # 余额偏差告警阈值（USDT）
      position_count_diff: 1          # 持仓数量偏差告警阈值

account:
  env: demo
  td_mode: cross   # cross 全仓 / isolated 逐仓。建议 cross 避免 set_leverage 被旧 TP/SL 单卡住

network:
  proxy_enabled: true              # 打开时 OKX REST 全部走 proxy_url
  proxy_url: "http://127.0.0.1:18081"

# ---------------- 多账户 (multi-account) ----------------
# 用于「一进程内并行跑多个策略/API key」的实盘部署。
# 每账户可选字段:
#   account_name / name          必填,标识 (用于 db account 列 + 日志前缀)
#   enabled                       默认 true;false 时跳过
#   env_adapt / env               real|live / demo
#   api_key / secret_key / passphrase   该账户的 OKX API 三件套
#   pairs                         该账户跑哪些 pair;缺省沿用 strategy.pairs
#   strategy                      可选,覆盖顶层 strategy 的任意字段(浅覆盖,pair_overrides 深合并)
#   td_mode                       cross / isolated;缺省沿用 account.td_mode
#
# 无 accounts 段 → 自动从 .env 合成一个名为 default 的账户(行为等价旧 main.py)
accounts:
  # ==================== 参数选拔口径 ====================
  # 每笔固定 10% margin,单笔封顶 1500 USDT,taker 5bp × 2,funding 3bp/8h,滑点 10bp。
  # 参数已过 Walk-Forward 反过拟合 (18 月 train → 6 月 test 仍盈利,MDD 不显著恶化)
  # 参数已过 10bp 滑点敏感性 (OKX 主流币日常滑点 5-15bp 是稳健区间)
  # 参数详情见 docs/回测三层验证报告.md
  #
  # ==================== 实盘账户 (2026-08-03 配置与模拟盘 v3-mixed A/B/C 对齐, 默认停用) ====================
  # 与下方模拟盘组合逐项一致; 验收通过后用「切到实盘」(GUI) 或 `hlbot-cli env live` 一键启用。
  #
  # 组合 A「6H 主攻」— 6H trend BTC + 6H trend ETH + 6H fade SOL
  - account_name: 初级炼气士-实盘
    group: 实盘
    enabled: false                    # ← 2026-08-22 实盘停机(单边行情待兼容), 数据已清
    strategy_name: v3-mixed
    strategy_start_date: "2026-08-17T00:00:00" # 实盘启动时间
    api_key: 241aad7c-62b4-4db5-a987-94b28112d550
    secret_key: A06DDE1F4CB061A4E1D63F7F29552548
    passphrase: Zdx19971226@@
    env_adapt: real
    pairs: [BTC-USDT-SWAP, ETH-USDT-SWAP, SOL-USDT-SWAP]
    strategy:
      # 组合 A 单独 5% 仓位(2026-07-29 决策): 10% 下回测 MDD 60.4% 穿硬停线, 5% 下 31.1%
      position_pct: 0.05
      signal_bar: 6H
      mode: trend
      pair_overrides:
        BTC-USDT-SWAP: { signal_bar: 6H, mode: trend, float_pct: 0.007, tp_pct: 0.008, sl_pct: 0.030 }
        ETH-USDT-SWAP: { signal_bar: 6H, mode: trend, float_pct: 0.003, tp_pct: 0.008, sl_pct: 0.030 }
        SOL-USDT-SWAP: { signal_bar: 6H, mode: fade,  float_pct: 0.010, tp_pct: 0.010, sl_pct: 0.030 }

  # 组合 B「混周期」— 1D trend BTC + 4H fade ETH + 6H fade SOL
  - account_name: 初级炼气士2-实盘
    group: 实盘
    enabled: false                    # ← 2026-08-22 实盘停机(单边行情待兼容), 数据已清
    strategy_name: v3-mixed
    strategy_start_date: "2026-08-17T00:00:00" # 实盘启动时间
