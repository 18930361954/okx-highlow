        BTC-USDT-SWAP: { signal_bar: 1D, mode: trend, float_pct: 0.010, tp_pct: 0.008, sl_pct: 0.025 }
        ETH-USDT-SWAP: { signal_bar: 4H, mode: fade,  float_pct: 0.010, tp_pct: 0.010, sl_pct: 0.025 }
        SOL-USDT-SWAP: { signal_bar: 6H, mode: fade,  float_pct: 0.005, tp_pct: 0.008, sl_pct: 0.030 }

  # 组合 C「防御高胜率」— 1D trend BTC + 12H reversal ETH + 6H fade SOL
